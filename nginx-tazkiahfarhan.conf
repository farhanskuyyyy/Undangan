# Undangan - Tazkiah Farhan
server {
    server_name tazkiahfarhan.my.id www.tazkiahfarhan.my.id;

    root /var/www/tazkiahfarhan;
    index index.html;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://127.0.0.1:3456;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Proxy uploaded photos
    location /uploads/ {
        proxy_pass http://127.0.0.1:3456;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tazkiahfarhan.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tazkiahfarhan.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.tazkiahfarhan.my.id) {
        return 301 https://tazkiahfarhan.my.id$request_uri;
    }

    if ($host = tazkiahfarhan.my.id) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name tazkiahfarhan.my.id www.tazkiahfarhan.my.id;
    return 404;
}
