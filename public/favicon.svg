<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Premium Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA9E5A" />
      <stop offset="25%" stop-color="#FDF0CD" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#8A6421" />
      <stop offset="90%" stop-color="#B89742" />
      <stop offset="100%" stop-color="#F5DA8A" />
    </linearGradient>
    
    <!-- Rose Gold Gradient -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B76E79" />
      <stop offset="30%" stop-color="#F3CFC6" />
      <stop offset="50%" stop-color="#E0A899" />
      <stop offset="70%" stop-color="#A8525F" />
      <stop offset="100%" stop-color="#E5AA9E" />
    </linearGradient>
    
    <!-- Sage Green Gradient for Leaves -->
    <linearGradient id="sage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FAF90" />
      <stop offset="50%" stop-color="#7B8D70" />
      <stop offset="100%" stop-color="#55664C" />
    </linearGradient>
    
    <!-- Soft Glow Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8A6421" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Circular background with subtle cream-to-blush gradient for premium contrast -->
  <circle cx="256" cy="256" r="236" fill="#FDFCFB" stroke="url(#gold)" stroke-width="6" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#F0D3C9" stroke-width="2" opacity="0.6" stroke-dasharray="8 6" />

  <!-- Elegant botanical wreath framing the center (leaves and flowers) -->
  <g transform="translate(256, 256) scale(0.9)">
    <!-- Right botanical branch -->
    <path d="M 0,160 C 90,160 160,90 160,0 C 160,-90 90,-160 0,-160" fill="none" stroke="url(#sage)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <!-- Left botanical branch -->
    <path d="M 0,160 C -90,160 -160,90 -160,0 C -160,-90 -90,-160 0,-160" fill="none" stroke="url(#sage)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    
    <!-- Beautiful leaves along the wreath -->
    <!-- Leaf pair top-left -->
    <path d="M -40,-155 C -60,-175 -85,-175 -90,-155 C -85,-135 -60,-135 -40,-155 Z" fill="url(#sage)" />
    <!-- Leaf pair top-right -->
    <path d="M 40,-155 C 60,-175 85,-175 90,-155 C 85,-135 60,-135 40,-155 Z" fill="url(#sage)" />
    
    <!-- Leaves left side -->
    <path d="M -125,-100 C -150,-110 -165,-95 -155,-80 C -130,-75 -115,-90 -125,-100 Z" fill="url(#sage)" />
    <path d="M -155,0 C -180,5 -185,-15 -165,-25 C -145,-15 -140,5 -155,0 Z" fill="url(#sage)" />
    <path d="M -125,100 C -150,110 -140,130 -125,120 C -110,110 -110,90 -125,100 Z" fill="url(#sage)" />
    
    <!-- Leaves right side -->
    <path d="M 125,-100 C 150,-110 165,-95 155,-80 C 130,-75 115,-90 125,-100 Z" fill="url(#sage)" />
    <path d="M 155,0 C 180,5 185,-15 165,-25 C 145,-15 140,5 155,0 Z" fill="url(#sage)" />
    <path d="M 125,100 C 150,110 140,130 125,120 C 110,110 110,90 125,100 Z" fill="url(#sage)" />

    <!-- Romantic rosebud illustrations at the bottom joint -->
    <circle cx="0" cy="160" r="14" fill="url(#roseGold)" />
    <path d="M -10,165 C -20,175 -30,170 -25,155 C -20,145 -5,155 -10,165 Z" fill="url(#roseGold)" opacity="0.9" />
    <path d="M 10,165 C 20,175 30,170 25,155 C 20,145 5,155 10,165 Z" fill="url(#roseGold)" opacity="0.9" />
    
    <!-- Elegant Intertwined Wedding Rings in the Center -->
    <g transform="translate(0, -10)">
      <!-- Ring 1 (Left - Gold) -->
      <circle cx="-50" cy="0" r="65" fill="none" stroke="url(#gold)" stroke-width="14" />
      <!-- Ring 2 (Right - Rose Gold) -->
      <circle cx="50" cy="0" r="65" fill="none" stroke="url(#roseGold)" stroke-width="14" />
      
      <!-- Intersecting overlap to make it look truly intertwined -->
      <path d="M -50,-65 A 65,65 0 0,1 10,-25" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" />
      <path d="M 50,65 A 65,65 0 0,1 -10,25" fill="none" stroke="url(#roseGold)" stroke-width="14" stroke-linecap="round" />
      
      <!-- Small shining diamond on the rose gold ring for extra premium detail -->
      <path d="M 50,-65 L 60,-80 L 50,-95 L 40,-80 Z" fill="#FFFFFF" opacity="0.9" filter="url(#shadow)" />
      <path d="M 50,-65 L 53,-80 L 50,-95 L 47,-80 Z" fill="#E6F7FF" />
      <!-- Diamond sparkles -->
      <circle cx="50" cy="-80" r="3" fill="#FFFFFF" />
      <path d="M 32,-80 L 68,-80 M 50,-98 L 50,-62" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    </g>
  </g>
</svg>